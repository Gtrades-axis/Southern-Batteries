<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Southern Batteries | Private Admin</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}.head{background:#111827;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.main{max-width:1100px;margin:35px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px;margin-bottom:20px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:700;font-size:13px}input,select,textarea{padding:11px;border:1px solid #d1d5db;border-radius:8px;font:inherit}.wide{grid-column:1/-1}.btn{padding:11px 15px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.outline{background:#fff;color:#111827;border:1px solid #cfd5df}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.msg{font-size:13px}.error{color:#b42318}.ok{color:#087443}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:13px}.thumb{width:55px;height:55px;object-fit:contain;background:#f3f4f6;border-radius:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.main{margin-top:20px}}
</style></head><body>
<header class="head"><div><strong>SOUTHERN BATTERIES</strong><small style="display:block;color:#cbd5e1;margin-top:3px">Private catalogue management</small></div><button id="logout" class="btn hidden">Sign out</button></header>
<main class="main">
<section id="login" class="panel"><h1>Admin sign in</h1><p>This private page is not linked from the customer website.</p><form id="loginForm"><div class="grid"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label></div><br><button class="btn" type="submit">Sign in</button><p id="loginMsg" class="msg"></p></form></section>
<section id="admin" class="hidden">
<div class="panel row"><div><h1>Product Management</h1><p>Add, edit, publish/hide and upload exact product photos.</p></div><button id="import" class="btn outline">Import 23 products</button></div>
<p id="msg" class="msg"></p>
<div class="panel"><h2 id="title">Add product</h2><form id="form"><input id="id" type="hidden"><div class="grid">
<label>Product name<input id="name" required></label><label>Brand<input id="brand"></label>
<label>Price (KSh)<input id="price" type="number" min="0" required></label>
<label>Category<select id="cat"><option value="powerlast">Powerlast</option><option value="chloride">Chloride Exide</option><option value="agm">AGM</option><option value="solar">Solar</option><option value="other">Other</option></select></label>
<label class="wide">Description<textarea id="desc"></textarea></label><label>Display order<input id="order" type="number" value="100"></label>
<label>Exact product photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
<label><input id="active" type="checkbox" checked> Published on public site</label><label><input id="stock" type="checkbox" checked> In stock</label>
</div><br><button class="btn" type="submit">Save product</button> <button id="cancel" class="btn outline hidden" type="button">Cancel</button></form></div>
<div class="panel"><div class="row"><h2>Products</h2><b id="count">0</b></div><div class="table"><table><thead><tr><th>Photo</th><th>Product</th><th>Price</th><th>Stock</th><th>Public</th><th>Actions</th></tr></thead><tbody id="table"></tbody></table></div></div>
</section></main>
<script type="module">
import {app} from "./js/firebase-config.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,orderBy,onSnapshot,doc,getDoc,setDoc,updateDoc,deleteDoc,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),$=x=>document.getElementById(x);let edit=null;
const starter=[["Powerlast","035 Powerlast",6800,"powerlast"],["Powerlast","045 Powerlast",8000,"powerlast"],["Powerlast","NS 70 Powerlast",9500,"powerlast"],["Powerlast","N70 Powerlast",12000,"powerlast"],["Powerlast","N 90 Powerlast",15000,"powerlast"],["Sebang AGM","DIN 80 MF Sebang AGM",23000,"agm"],["AGM","DIN 70 MF AGM",21000,"agm"],["Sebang AGM","DIN 60 MF Sebang AGM",18500,"agm"],["Exide AGM","DIN 070 MF L Exide AGM",23500,"agm"],["Chloride Exide","NS70 SBL Chloride Exide",8000,"chloride"],["Chloride Exide","NS 70 SBR Chloride Exide",8000,"chloride"],["Solar Spark","050 Salar Spark",8000,"solar"],["Solar Powerlast","050 MFL Solar Powerlast",8200,"solar"],["Powerlast","DIN 55 MF Powerlast",11500,"powerlast"],["Powerlast","DIN 60 MF Powerlast",12500,"powerlast"],["Chloride Exide","N70 MFR Chloride Exide",12500,"chloride"],["Powerlast","DIN 80 Powerlast",15000,"powerlast"],["Powerlast","DIN 88 MF Powerlast",16000,"powerlast"],["Powerlast","DIN 100 MF Powerlast",20000,"powerlast"],["Powerlast","100 MF Powerlast",14500,"powerlast"],["Powerlast","N 150 MFR Powerlast",25000,"powerlast"],["Powerlast","N 220 MFL Powerlast",30000,"powerlast"],["Solar Spark","O26 Solar Spark",5200,"solar"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function message(t,c=""){ $("msg").textContent=t;$("msg").className="msg "+c }
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="Signing in...";try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(x){console.error(x);$("loginMsg").textContent="Sign-in failed. Check your credentials and admin access."}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hidden");$("admin").classList.add("hidden");$("logout").classList.add("hidden");return}try{const a=await getDoc(doc(db,"admins",u.uid));if(!a.exists()){await signOut(auth);$("loginMsg").textContent="This account is not authorised as an admin.";return}$("login").classList.add("hidden");$("admin").classList.remove("hidden");$("logout").classList.remove("hidden");listen()}catch(e){console.error(e);await signOut(auth);$("loginMsg").textContent="Could not verify admin access. Check Firestore rules."}});
function listen(){onSnapshot(query(collection(db,"products"),orderBy("sortOrder","asc")),s=>{const ps=s.docs.map(d=>({id:d.id,...d.data()}));$("count").textContent=ps.length;$("table").innerHTML=ps.map(p=>`<tr><td>${p.imageUrl?`<img class="thumb" src="${esc(p.imageUrl)}">`:"—"}</td><td><b>${esc(p.name)}</b><small>${esc(p.brand||"")}</small></td><td>KSh ${Number(p.price||0).toLocaleString("en-KE")}</td><td>${p.inStock?"In stock":"Unavailable"}</td><td>${p.active?"Published":"Hidden"}</td><td><button data-e="${p.id}">Edit</button> <button data-t="${p.id}" data-a="${p.active?1:0}">${p.active?"Hide":"Publish"}</button> <button data-d="${p.id}">Delete</button></td></tr>`).join("");$("table").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const p=ps.find(x=>x.id===b.dataset.e);edit=p.id;$("id").value=p.id;$("name").value=p.name||"";$("brand").value=p.brand||"";$("price").value=p.price||"";$("cat").value=p.category||"other";$("desc").value=p.description||"";$("order").value=p.sortOrder||100;$("active").checked=p.active!==false;$("stock").checked=p.inStock!==false;$("title").textContent="Edit product";$("cancel").classList.remove("hidden");scrollTo(0,0)});$("table").querySelectorAll("[data-t]").forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,"products",b.dataset.t),{active:b.dataset.a!=="1",updatedAt:serverTimestamp()})}catch(e){message("Could not update product.","error")}});$("table").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this product?"))try{await deleteDoc(doc(db,"products",b.dataset.d))}catch(e){message("Could not delete product.","error")}})},e=>message("Products could not be loaded. Check Firestore rules.","error"))}
$("form").onsubmit=async e=>{e.preventDefault();message("Saving...");try{const id=edit||slug($("name").value)+"-"+Date.now().toString(36);const data={name:$("name").value.trim(),brand:$("brand").value.trim(),price:Number($("price").value),category:$("cat").value,description:$("desc").value.trim(),sortOrder:Number($("order").value||100),active:$("active").checked,inStock:$("stock").checked,updatedAt:serverTimestamp()};const f=$("photo").files[0];if(f){if(!/^image\\/(jpeg|png|webp)$/.test(f.type))throw Error("Use JPG, PNG or WEBP.");if(f.size>5*1024*1024)throw Error("Photo must be 5MB or smaller.");const r=ref(storage,`products/${id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`);await uploadBytes(r,f,{contentType:f.type});data.imageUrl=await getDownloadURL(r)}if(edit)await updateDoc(doc(db,"products",id),data);else{data.createdAt=serverTimestamp();await setDoc(doc(db,"products",id),data)}reset();message("Product saved.","ok")}catch(x){console.error(x);message(x.message||"Could not save product.","error")}};
function reset(){edit=null;$("form").reset();$("order").value=100;$("active").checked=true;$("stock").checked=true;$("title").textContent="Add product";$("cancel").classList.add("hidden")}
$("cancel").onclick=reset;
$("import").onclick=async()=>{if(!confirm("Import the 23 starter products?"))return;message("Importing...");try{const b=writeBatch(db);starter.forEach(([brand,name,price,category],i)=>b.set(doc(db,"products","starter-"+slug(name)),{brand,name,price,category,description:"Quality battery. Contact Southern Batteries for availability and fitment.",sortOrder:i+1,active:true,inStock:true,imageUrl:"",updatedAt:serverTimestamp()},{merge:true}));await b.commit();message("23 starter products imported.","ok")}catch(e){console.error(e);message("Import failed. Check admin Firestore permissions.","error")}};
</script></body></html>
